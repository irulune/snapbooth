<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#faf8f3'>
<title>Snapbooth</title>
<meta name='description' content='Share photobooth strips, follow friends, and send messages.'>
<link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap'>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#1c1a16;--mute:#8a8373;--line:#e8e2d3;--a:#7b6cf6;--red:#e0245e;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h2{font:700 20px Fraunces,Georgia,serif;margin:0}
.logo{font:700 26px Fraunces,Georgia,serif;letter-spacing:-.01em}
.mute{color:var(--mute)}.pad{padding:8px 16px}.grow{flex:1;min-width:0}
.cut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
nav a{position:relative;display:flex;align-items:center;justify-content:center;min-width:56px;min-height:48px;color:var(--mute)}
nav a[aria-current=page]{color:var(--ink)}
nav .l,.brand{display:none}
.badge{position:absolute;top:4px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
main{max-width:630px;margin:0 auto;padding:12px 0 calc(84px + env(safe-area-inset-bottom))}
.inthread main{padding-bottom:0}
@media(max-width:859px){.inthread nav{display:none}}
@media(min-width:860px){
 body{padding-left:230px}
 nav{top:0;bottom:auto;right:auto;width:230px;height:100%;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 12px}
 nav a{justify-content:flex-start;gap:14px;padding:8px 12px;border-radius:12px}
 nav a:hover{background:rgba(0,0,0,.05)}
 nav .l{display:inline}.brand{display:block;padding:4px 12px 22px}
 main{padding-bottom:48px}.mob{display:none}
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 12px}
.seg{display:flex;gap:6px}
.chip{min-height:40px;padding:6px 16px;border-radius:99px;border:1px solid var(--line);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);font-weight:700;background:var(--card)}
.btn.p{background:var(--a);border-color:var(--a);color:#fff}.btn.wide{width:100%}.btn:disabled{opacity:.4}
.lnk{text-decoration:underline;text-underline-offset:4px;color:var(--mute);min-height:36px;padding:0 4px}
input,textarea{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:inherit}
textarea{resize:vertical}
.err{color:#b3261e;min-height:1.3em;margin:6px 0;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.post{background:var(--card);border-block:1px solid var(--line);margin-bottom:18px}
@media(min-width:630px){.post{border:1px solid var(--line);border-radius:14px;overflow:hidden}}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px}.ph small{margin-left:auto;color:var(--mute)}
.pi{position:relative;line-height:0;background:#efe9da;user-select:none}.pi img{width:100%;height:auto;display:block}
.pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.pop svg{width:96px;height:96px;fill:#fff;stroke:#fff}
.pop.on{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.pa{display:flex;gap:2px;padding:6px 8px 0}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib[aria-pressed=true] svg{fill:var(--red);stroke:var(--red)}
.pt{padding:0 14px 12px;font-size:15px}.pt p{margin:2px 0}.song{color:var(--mute);font-size:14px}
.cm{padding:0 14px 12px}.cm p{margin:4px 0;font-size:15px}
.cf{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;padding:48px 24px;display:grid;gap:10px;justify-items:center}
.pf{display:flex;gap:24px;align-items:center;padding:8px 16px}
.stats{display:flex;gap:22px;text-align:center;font-size:14px}.stats b{display:block;font-size:17px}
.bio{margin:6px 0;white-space:pre-wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:18px}
.tile{padding:0;aspect-ratio:1;background:#efe9da;overflow:hidden;line-height:0}.tile img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--a);flex:none}
.msgs{display:flex;flex-direction:column;gap:6px;padding:12px 16px;min-height:60dvh}
.b{max-width:78%;padding:8px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);overflow-wrap:anywhere;align-self:flex-start}
.b.me{align-self:flex-end;background:var(--a);border-color:var(--a);color:#fff}
.compose{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.auth{max-width:340px;margin:10dvh auto;padding:24px 20px;text-align:center;display:grid;gap:10px}
.auth .logo{font-size:40px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:16px;width:min(520px,calc(100% - 24px));max-height:90dvh;overflow:auto}
dialog::backdrop{background:rgba(28,26,22,.45)}dialog .post{border:0;margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.pop.on{animation:none}*{transition:none!important}}

.frow{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}.frow::-webkit-scrollbar{display:none}
.frow .chip{flex:none}
.view{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#1c1a16}
.view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cd{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 min(30vw,170px) Fraunces,serif;text-shadow:0 4px 40px rgba(0,0,0,.5);pointer-events:none}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#fl.on{animation:fl .35s ease-out}
@keyframes fl{from{opacity:.9}to{opacity:0}}
#msg{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;color:#fff;padding:20px;background:rgba(28,26,22,.78)}
.shut{display:flex;justify-content:center;padding:4px 0}
#go{width:72px;height:72px;border-radius:50%;background:var(--bg);border:3px solid var(--a);position:relative}
#go:after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--a);transition:transform .12s}
#go:active:after{transform:scale(.86)}#go:disabled{opacity:.35}
.songs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.songs::-webkit-scrollbar{display:none}
.song{flex:none;min-height:40px;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-weight:500;white-space:nowrap}
.song i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.song[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--t)}.song[aria-pressed=true] i{background:var(--t)}
.np{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.np img{width:56px;height:56px;border-radius:8px;background:var(--line);object-fit:cover;flex:none}.np img:not([src]){visibility:hidden}
.meta{flex:1;min-width:0}.meta b,.meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta span{font-size:14px;color:var(--mute)}
.pbar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--a)}
#pp{width:44px;height:44px;border-radius:50%;background:var(--a);color:#fff;flex:none;font-size:14px}#pp:disabled{opacity:.35}
details summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:500}
.lb{max-height:190px;overflow:auto;font-size:15px}.lb p{margin:4px 0}.cp{font-size:12px;color:var(--mute)}
.cr{display:grid;gap:14px;padding:0 16px}.cr h2{margin:0}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.cpv{display:block;margin:0 auto;max-width:100%;height:auto;box-shadow:0 6px 20px rgba(60,45,15,.2)}.cpv.s{max-width:260px}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.opt[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.opt small{display:block;color:var(--mute)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.sw input{width:22px;height:22px;padding:0;accent-color:var(--a)}
.lbl{font-weight:700;margin:4px 0 -6px;font-size:15px}
.menu{position:fixed;z-index:60;min-width:240px;max-width:calc(100% - 16px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(40,28,8,.25);padding:6px;display:grid}
.menu button{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:9px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--bg)}
.menu .ck{width:18px;color:var(--a);font-weight:700}.menu .danger{color:#b3261e}
.menu .mh{padding:8px 12px 2px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
@media(max-width:600px){.menu{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-width:none;border-radius:18px 18px 0 0;padding-bottom:calc(6px + env(safe-area-inset-bottom))}}
.pi.tall{display:grid;place-items:center;padding:12px 0}.pi.tall img{width:auto;max-width:72%;max-height:78dvh}
.vb{display:inline-flex;align-items:center;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:6px}
.tile{position:relative}.tile .vb{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.92);margin:0;line-height:1.5}.tile img.top{object-position:top}
#pa{display:none}
@media print{@page{margin:.8cm}body{background:none!important;padding:0!important}body>*:not(#pa){display:none!important}#pa{display:flex!important;flex-wrap:wrap;gap:.6cm;justify-content:center}#pa img{max-height:24cm;max-width:19cm;width:auto;height:auto;break-inside:avoid}}
</style>
</head>
<body>
<div id='root'></div>
<dialog id='dlg'></dialog>
<div id='toast' role='status'></div>
<script src='app.js' defer></script>
<script src='create.js' defer></script>
</body>
</html>
